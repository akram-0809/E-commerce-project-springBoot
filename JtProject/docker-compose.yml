version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ecommjava-mysql
    environment:
      MYSQL_DATABASE: ecommjava
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ecommuser
      MYSQL_PASSWORD: ecommpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./basedata.sql:/docker-entrypoint-initdb.d/basedata.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: